# Фильтр fail2ban для перебора пароля на входе в Voxa.
# Читает JSON-журнал Caddy: ловим ответы 401 на POST /api/auth/login.
# Свои лимиты у приложения тоже есть (5 попыток в минуту), но они живут
# в процессе; fail2ban режет источник на уровне файрвола.

[Definition]
failregex = ^.*"client_ip":"<HOST>".*"uri":"/api/auth/login".*"status":401
ignoreregex =
datepattern = LongEpoch
