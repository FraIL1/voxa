<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Voxa</title>
    <style>
      /* Отдельное окно запуска. Живёт без сборки и без шрифтов из сети —
         должно нарисоваться мгновенно, ещё до загрузки самого приложения. */
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #94a6c0;
        background:
          radial-gradient(30rem 16rem at 50% 34%, rgba(34, 211, 238, 0.16), transparent 70%),
          linear-gradient(160deg, #0f1521 0%, #080b12 60%);
        border: 1px solid #223247;
      }

      /* Знак и расходящиеся от него круги */
      .mark {
        position: relative;
        display: grid;
        place-items: center;
      }

      .logo {
        position: relative;
        z-index: 1;
        display: block;
        width: 74px;
        height: 74px;
        object-fit: contain;
        /* Тень по форме знака, а не по его прямоугольнику */
        filter: drop-shadow(0 14px 34px rgba(34, 211, 238, 0.35));
        animation: breath 2.4s ease-in-out infinite;
      }

      .ring {
        position: absolute;
        width: 74px;
        height: 74px;
        border-radius: 24px;
        border: 2px solid rgba(34, 211, 238, 0.4);
        opacity: 0;
        animation: wave 2.4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
      }

      .ring.delayed {
        animation-delay: 1.2s;
      }

      @keyframes breath {
        50% {
          transform: scale(1.05);
        }
      }

      @keyframes wave {
        0% {
          opacity: 0.7;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(2.3);
        }
      }

      /* Звуковая волна: приложение о голосе — и запускается «голосом» */
      .bars {
        display: flex;
        align-items: flex-end;
        gap: 5px;
        height: 24px;
      }

      .bars span {
        width: 4px;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(180deg, #22d3ee, #2dd4bf);
        transform-origin: bottom;
        animation: bar 1.1s ease-in-out infinite;
      }

      .bars span:nth-child(2) {
        animation-delay: 0.12s;
      }
      .bars span:nth-child(3) {
        animation-delay: 0.24s;
      }
      .bars span:nth-child(4) {
        animation-delay: 0.36s;
      }
      .bars span:nth-child(5) {
        animation-delay: 0.48s;
      }

      @keyframes bar {
        0%,
        100% {
          transform: scaleY(0.28);
          opacity: 0.5;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      .hint {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      .name {
        position: absolute;
        bottom: 16px;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #4a5a72;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <span class="ring"></span>
      <span class="ring delayed"></span>
      <img class="logo" src="icon-512.png" alt="" />
    </div>

    <div class="bars">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <p class="hint">Запускаем Voxa</p>
    <span class="name">Voxa</span>
  </body>
</html>
